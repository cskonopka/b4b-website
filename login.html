<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Burgers4Bryce – Login</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="container position-relative py-5">
        <!-- 🍔 Header Section -->
        <header class="login-header text-center mb-4">
            <h1 class="login-title">
                🍔 <span>Burgers4Bryce</span> 🍔
            </h1>
            <div>
            </div>
            <p class="login-subtitle">
                <em>“Very freshness meat, very special sauce. Sign in for happiness!”</em>
            </p>
            <img src="assets/b4b_logo.png" alt="Burgers4Bryce logo" width="10%">
        </header>
        <div class="row justify-content-center align-items-center position-relative">
            <!-- Left burger gif -->
            <div class="col-2 d-none d-md-flex justify-content-center">
                <img src="assets/dancingburger_aj.gif" alt="Left burger" class="side-gif">
            </div>
            <!-- Login modal -->
            <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                <div class="b4b-card p-4 text-center">
                    <div class="d-flex align-items-center justify-content-center gap-3 mb-3">
                        <div>
                            <div class="text-secondary small">Sign in to continue</div>
                        </div>
                    </div>
                    <div id="alert" class="alert alert-danger py-2 px-3 d-none" role="alert"></div>
                    <form id="login-form" method="post" action="#" class="mt-3">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input id="username" name="username" class="form-control" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                                <button id="togglePw" class="btn btn-outline-secondary" type="button" aria-label="Show password">👁️</button>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <button id="loginBtn" class="btn btn-b4b" type="submit">
                        <span class="spinner-border spinner-border-sm me-2 d-none" id="loginSpinner" role="status" aria-hidden="true"></span>
                        <span id="loginText">Login</span>
                        </button>
                            <small id="status" class="text-secondary" aria-live="polite"></small>
                        </div>
                    </form>
                </div>
            </div>
            <!-- Right burger gif -->
            <div class="col-2 d-none d-md-flex justify-content-center">
                <img src="assets/dancingburger_aj.gif" alt="Right burger" class="side-gif">
            </div>
        </div>
        <!-- Bottom gif line -->
        <div class="gif-line-bottom"></div>
    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Login logic (username-hash + PBKDF2 + spinner) -->
    <script src="login.js"></script>
</body>

</html>
