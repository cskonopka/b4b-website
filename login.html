<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Burgers4Bryce – Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="d-flex align-items-center" style="min-height:100dvh;">

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                <div class="b4b-card p-4">
                    <!-- Logo + title -->
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div class="b4b-logo">
                            <!-- <img src="assets/logo.svg" alt="Burgers4Bryce logo" width="26" height="26"> -->
                        </div>
                        <div>
                            <div class="h5 m-0 b4b-title">Burgers4Bryce</div>
                            <div class="text-secondary small">Sign in to continue</div>
                        </div>
                    </div>

                    <!-- Alert placeholder -->
                    <div id="alert" class="alert alert-danger py-2 px-3 d-none" role="alert"></div>

                    <!-- Login form -->
                    <form id="login-form" method="post" action="#" class="mt-3">
                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input id="username" name="username" class="form-control" autocomplete="username" required>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                                <button id="togglePw" class="btn btn-outline-secondary" type="button" aria-label="Show password">👁️</button>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="d-flex justify-content-between align-items-center">
                            <!-- Button with spinner -->
                            <button id="loginBtn" class="btn btn-b4b" type="submit">
                <span class="spinner-border spinner-border-sm me-2 d-none" id="loginSpinner" role="status" aria-hidden="true"></span>
                <span id="loginText">Login</span>
              </button>
                            <small id="status" class="text-secondary" aria-live="polite"></small>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Login logic (username-hash + PBKDF2 + spinner) -->
    <script src="login.js"></script>
</body>

</html>
