<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Burgers4Bryce</title>

    <!-- 🔒 Early auth gate -->
    <script>
      (function () {
        var LOGIN = 'login.html';
        try {
          var raw = localStorage.getItem('b4b_auth');
          var ok = raw && JSON.parse(raw).user;
          if (!ok) {
            document.write('');
            document.close();
            location.replace(LOGIN + '#auth=required');
          }
        } catch {
          document.write('');
          document.close();
          location.replace(LOGIN + '#auth=required');
        }
      }());
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <style>
      .b4b-iframe { width: 100%; aspect-ratio: 16 / 9; background:#000; border:0; }
    </style>
  </head>
  <body>
    <!-- NAV BAR-->
    <nav class="navbar b4b-glass sticky-top">
      <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap">
        <a class="navbar-brand d-flex align-items-center gap-2 flex-shrink-0" href="#">
          <span class="b4b-logo">
            <img src="assets/b4b_logo.png" alt="B4B logo" width="26" height="26">
          </span>
          <span class="b4b-title d-flex align-items-center gap-1">
            Burgers4Bryce <img src="assets/faceburger_aj.gif" alt="Burger face" style="width:32px; height:auto;">
          </span>
        </a>
        <div class="d-flex flex-wrap justify-content-end align-items-center gap-2">
          <a id="testimonialBtn" href="#testimonials" class="btn btn-b4b btn-sm">💬 Testimonials</a>
          <a id="submitBtn" class="btn btn-b4b btn-sm" type="button">🎥 Submit Video</a>
          <a id="logoutBtn" class="btn btn-outline-light btn-sm" type="button">🚪 Logout</a>
        </div>
      </div>
    </nav>

    <br>
    <div class="text-center mt-2 mb-3">
      <span class="best-meat-banner">⭐ "Plain, nothing on it!"" ⭐ 平原。上面什么也没有。 ⭐</span>
    </div>

    <main class="container py-4">
      <!-- ✨ CUSTOMER TESTIMONIALS ✨ -->
      <section id="testimonials" class="text-center mb-5">
        <h1 class="mb-3">CUSTOMER TESTIMONIALS 我们的肉最特别!</h1>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4 mt-4 b4b-grid" id="grid">
          <!-- Tiles injected by JS -->
        </div>
      </section>
    </main>

    <!-- 🖥 IFRAME-ONLY VIDEO MODAL (no download/status) -->
    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content b4b-card">
          <div class="modal-body p-0">
            <iframe id="videoFrame"
                    class="b4b-iframe"
                    allow="autoplay; fullscreen"
                    referrerpolicy="no-referrer-when-downgrade"
                    loading="lazy"></iframe>
          </div>
        </div>
      </div>
    </div>

    <footer class="b4b-footer mt-5">
      <div class="container-fluid py-3">
        <hr class="footer-hr my-3"/>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="home.js"></script>
  </body>
</html>
