<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Burgers4Bryce – Home</title>

    <!-- 🔒 Early auth gate -->
    <script>
        (function() {
            var LOGIN = 'login.html';
            try {
                var raw = localStorage.getItem('b4b_auth');
                var ok = raw && JSON.parse(raw).user;
                if (!ok) {
                    document.write('');
                    document.close();
                    location.replace(LOGIN + '#auth=required');
                }
            } catch {
                document.write('');
                document.close();
                location.replace(LOGIN + '#auth=required');
            }
        }());
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <style>
        .b4b-grid .ratio {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #1f2330;
            background: #0f1117;
        }
        /* .b4b-tile-badge {
            position: absolute;
            bottom: .5rem;
            left: .5rem;
            font-size: .75rem;
            background: rgba(0, 0, 0, .55);
            color: #fff;
            padding: .25rem .5rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, .12);
        } */
        
        .b4b-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .b4b-modal-video {
            width: 100%;
            height: auto;
            max-height: 80vh;
            background: #000;
        }
    </style>
</head>

<body>
    <!-- Top bar -->
    <nav class="navbar b4b-glass sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <span class="b4b-logo"><img src="assets/logo.svg" alt="B4B logo" width="26" height="26"></span>
                <span class="b4b-title">Burgers4Bryce</span>
            </a>
            <div class="d-flex gap-2">
                <button id="submitBtn" class="btn btn-b4b btn-sm" type="button">Submit Video</button>
                <button id="logoutBtn" class="btn btn-outline-light btn-sm" type="button">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Grid -->
    <main class="container py-4">
        <div id="grid" class="row g-3 b4b-grid" aria-live="polite" aria-busy="true">
            <!-- populated by JS -->
        </div>
    </main>

    <!-- Modal for video -->
    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content b4b-card">
                <div class="modal-header">
                    <h5 class="modal-title" id="videoTitle">Video</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body d-flex justify-content-center p-0">
                    <video id="videoPlayer" class="b4b-modal-video" playsinline muted controls preload="metadata"></video>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="home.obf.js"></script>
</body>

</html>
